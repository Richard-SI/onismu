services:
  db:
    image: postgres:16-alpine
    container_name: onismu-db
    environment:
      POSTGRES_USER: onismu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onismu_dev}
      POSTGRES_DB: onismu
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - onismu_pgdata:/var/lib/postgresql/data
      - ./server/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onismu -d onismu"]
      interval: 5s
      timeout: 3s
      retries: 20
  # Metabuscador local e gratuito para a coleta (BUSCA_PROVEDOR=searxng). Opcional.
  searxng:
    image: searxng/searxng:latest
    container_name: onismu-searxng
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
    restart: unless-stopped
volumes:
  onismu_pgdata:
